name: Speech acceptance

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Standard Hermes / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [base, grpc, storage]
    env:
      UV_PROJECT_ENVIRONMENT: /opt/hermes/venv
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
      - name: Prepare the canonical standard Hermes runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /opt/hermes
          git init /opt/hermes/src
          git -C /opt/hermes/src remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /opt/hermes/src fetch --depth 1 origin 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          git -C /opt/hermes/src checkout -b stock-hermes-v0.23.0 FETCH_HEAD
          test "$(git -C /opt/hermes/src rev-parse HEAD)" = 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          uv sync --project /opt/hermes/src --frozen --no-default-groups --extra messaging --python "$(command -v python)"
          printf 'VIRTUAL_ENV=%s\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_PATH"
      - name: Install development tools in the configured runtime
        run: uv pip install --python python -r requirements.txt -r requirements-dev.txt
      - name: Admit the optional profile
        shell: bash
        run: |
          if [[ "${{ matrix.profile }}" == grpc ]]; then
            uv pip install --python python -r requirements-grpc.txt "grpcio-tools==1.76.0" "protobuf==6.33.6"
          fi
          if [[ "${{ matrix.profile }}" == storage ]]; then
            uv pip install --python python "boto3==1.42.89"
            python -c "import boto3; assert boto3.__version__ == '1.42.89'"
          fi
      - name: Validate native dependency constraints
        shell: bash
        run: |
          python -c 'import subprocess,sys; from pathlib import Path; from pm.pip_check import unexpected_incompatibilities; r=subprocess.run(["uv","pip","check","--python",sys.executable],capture_output=True,text=True); problems=[] if r.returncode == 0 else unexpected_incompatibilities(r.stdout+r.stderr,Path("/opt/hermes/src/uv.lock")); print("Unexpected dependency incompatibilities:","unreadable report" if problems is None else len(problems)); sys.exit(problems is None or bool(problems))'
      - name: Verify stock Discord streaming contracts
        run: python -m unittest tests.test_discord_ingress
      - name: Run offline acceptance
        run: python -m tests --increment feedback --profile ${{ matrix.profile }}
      - name: Verify source and wrapper syntax
        shell: bash
        run: |
          python -m compileall -q yandex_speech scripts integrations tests
          bash -n scripts/hermes-stt-wrapper.sh scripts/hermes-tts-wrapper.sh
          git diff --check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: feedback-${{ matrix.profile }}-evidence
          path: .agent/tasks/public-release/testing-evidence/feedback-*.json
          include-hidden-files: true
